<svg xmlns="http://www.w3.org/2000/svg" width="560" height="356" viewBox="0 0 560 356" role="img" aria-label="Example channel posts: power is out since 14:02; power is back at 16:40 after 2 h 38 min; and a private /status reply">
  <title>power-watch in a Telegram channel and a private chat</title>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .name { font-size: 13px; font-weight: 600; fill: #6ab3f3; }
    .msg { font-size: 15px; fill: #f5f5f5; }
    .time { font-size: 11px; fill: #8a9aa9; }
    .head { font-size: 12px; font-weight: 600; fill: #8a9aa9; letter-spacing: .06em; }
    .me { font-size: 15px; fill: #ffffff; }
  </style>
  <rect width="560" height="356" rx="14" fill="#0e1621"/>

  <text x="24" y="32" class="head">CHANNEL</text>
  <circle cx="40" cy="68" r="16" fill="#2b5278"/>
  <text x="40" y="74" font-size="16" text-anchor="middle">⚡</text>
  <rect x="66" y="46" width="300" height="56" rx="12" fill="#182533"/>
  <text x="80" y="66" class="name">power-watch</text>
  <text x="80" y="89" class="msg">⚡ Power is out since 14:02.</text>
  <text x="352" y="96" class="time" text-anchor="end">14:03</text>

  <circle cx="40" cy="134" r="16" fill="#2b5278"/>
  <text x="40" y="140" font-size="16" text-anchor="middle">⚡</text>
  <rect x="66" y="112" width="380" height="56" rx="12" fill="#182533"/>
  <text x="80" y="132" class="name">power-watch</text>
  <text x="80" y="155" class="msg">✅ Power is back at 16:40, after 2 h 38 min.</text>
  <text x="432" y="162" class="time" text-anchor="end">16:42</text>

  <line x1="24" y1="190" x2="536" y2="190" stroke="#1f2c3a"/>
  <text x="24" y="214" class="head">PRIVATE CHAT</text>
  <rect x="436" y="228" width="100" height="36" rx="12" fill="#2b5278"/>
  <text x="452" y="251" class="me">/status</text>
  <rect x="66" y="274" width="330" height="70" rx="12" fill="#182533"/>
  <text x="80" y="297" class="msg">💡 Power is on since 16:40 (1 h 5 min).</text>
  <text x="80" y="321" class="msg">🌫 PM2.5: 7 µg/m³ (good)</text>
  <text x="382" y="336" class="time" text-anchor="end">17:45</text>
</svg>
