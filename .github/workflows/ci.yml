name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python }}${{ matrix.crypto && ', with cryptography' || '' }})
    # Pinned: Python 3.9 (Raspberry Pi OS Bullseye) is end-of-life and may have no build for newer images.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        crypto: [false]
        include:
          # The optional purifier dependency, on the oldest and newest supported Python.
          - python: "3.9"
            crypto: true
          - python: "3.13"
            crypto: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.crypto
        run: pip install cryptography
      - run: python -m unittest discover -s tests -t . -v

  lint:
    name: ruff + mypy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  install:
    name: installer + single-file build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh
      - name: build the executable and smoke-test it
        run: |
          ./install.sh --build /tmp/power-watch
          /tmp/power-watch --version
          /tmp/power-watch --help
          # Exit codes survive the zipapp: 2 = config error, 1 = device not answering.
          set +e
          POWER_WATCH_OFF_AFTER=x /tmp/power-watch; test $? -eq 2 || exit 1
          /tmp/power-watch --probe 127.0.0.1; test $? -eq 1 || exit 1
