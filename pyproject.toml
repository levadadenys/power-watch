[project]
name = "power-watch"
description = "Know when the power goes out at home: a mains-powered Xiaomi Wi-Fi device as the sensor, posts to a Telegram channel"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
version = "0.1.0"

[project.optional-dependencies]
purifier = ["cryptography"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "RUF"]
# Ukrainian message strings are intentional, not look-alike characters.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
